<?xml version="1.0" encoding="UTF-8"?>
<!--
  favicon.svg — ICONO DEL SITIO HardPoint PC
  Representa un procesador (el componente más característico de la
  tienda) con el degradado azul rey y morado pastel de la paleta
  definida en static/css/tema.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HardPoint PC">
  <defs>
    <linearGradient id="degradadoHardPoint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C63D2"/>
      <stop offset="100%" stop-color="#8B7BD8"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#degradadoHardPoint)"/>

  <!-- Cuerpo del procesador -->
  <rect x="18" y="18" width="28" height="28" rx="5" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="26" y="26" width="12" height="12" rx="2.5" fill="#FFFFFF"/>

  <!-- Patas del procesador -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <line x1="25" y1="12" x2="25" y2="18"/>
    <line x1="32" y1="12" x2="32" y2="18"/>
    <line x1="39" y1="12" x2="39" y2="18"/>
    <line x1="25" y1="46" x2="25" y2="52"/>
    <line x1="32" y1="46" x2="32" y2="52"/>
    <line x1="39" y1="46" x2="39" y2="52"/>
    <line x1="12" y1="25" x2="18" y2="25"/>
    <line x1="12" y1="32" x2="18" y2="32"/>
    <line x1="12" y1="39" x2="18" y2="39"/>
    <line x1="46" y1="25" x2="52" y2="25"/>
    <line x1="46" y1="32" x2="52" y2="32"/>
    <line x1="46" y1="39" x2="52" y2="39"/>
  </g>
</svg>
